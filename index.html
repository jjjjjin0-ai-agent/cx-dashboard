<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CX 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 고정 사이드바 + 스크롤 본문. 상단 기간 조회 바 → KPI 카드 그리드 */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f0f3f8; --line:#e3e8ef;
  --fg:rgba(42,44,47,1); --muted:rgba(42,44,47,0.72); --faint:rgba(42,44,47,0.55);
  --accent:#2563eb; --accent-soft:#e8effd; --on-accent:#ffffff;
  --good:#16a34a; --bad:#d93a3a; --bad-soft:#fdecec;
  --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c24; --surface-2:#1e2530; --line:#29313d;
  --fg:#f3f4f6; --muted:rgba(243,244,246,0.72); --faint:rgba(243,244,246,0.55);
  --accent:#6b9cff; --accent-soft:#1c2a45; --on-accent:#0f1319;
  --good:#4ade80; --bad:#f27272; --bad-soft:#341b1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --surface-2:#1e2530; --line:#29313d;
  --fg:#f3f4f6; --muted:rgba(243,244,246,0.72); --faint:rgba(243,244,246,0.55);
  --accent:#6b9cff; --accent-soft:#1c2a45; --on-accent:#0f1319;
  --good:#4ade80; --bad:#f27272; --bad-soft:#341b1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.navlabel{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:0 8px;margin-bottom:6px;font-weight:600}
.nav a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;text-decoration:none;color:var(--fg)}
.nav a.on{background:var(--surface-2)}
.nav a .ic{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.nav a b{display:block;font-size:14px}
.nav a small{color:var(--muted);font-size:12px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:12px;line-height:1.55}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--good)}

/* Main */
.main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;min-width:0}
.head h1{margin:0;font-size:24px;letter-spacing:-.01em}
.head .sync{color:var(--muted);font-size:12px}

/* 기간 조회 */
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.qrow .lbl{font-size:12px;color:var(--muted)}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;background:var(--surface);flex-wrap:wrap}
.field:focus-within{border-color:var(--accent)}
.field.err{border-color:var(--bad)}
.field input{border:none;background:transparent;width:104px;font-family:var(--mono);font-size:14px;padding:4px 2px;outline:none;letter-spacing:.02em}
.field input::placeholder{color:var(--faint)}
.field .sep{color:var(--faint)}
.calbtn{border:none;background:var(--surface-2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.calbtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.go{border:none;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:10px;padding:8px 18px}
.hint{font-size:12px;color:var(--faint)}
.msg{font-size:12px;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:6px 10px}
.qshorts{display:flex;gap:6px;flex-wrap:wrap}
.qshort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.qshort:hover{background:var(--surface-2);color:var(--fg)}
.qshort.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* 캘린더 팝오버 */
.cal{position:absolute;top:calc(100% + 6px);left:14px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(15,25,40,.14);padding:14px;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 32px)}.cal[hidden]{display:none}
.cal .months{display:flex;gap:20px}
.month{width:252px}
.month .mh{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:4px}
.month .mh b{font-size:14px}
.navb{border:none;background:transparent;width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:16px}
.navb:hover{background:var(--surface-2)}
.navb.ghost{visibility:hidden}
.days{display:grid;grid-template-columns:repeat(7,36px);row-gap:2px}
.days .wd{font-size:11px;color:var(--faint);text-align:center;height:24px;line-height:24px}
.days .wd.sun{color:var(--bad)}
.day{border:none;background:transparent;height:34px;font-size:13px;border-radius:0;position:relative}
.day:hover{background:var(--surface-2);border-radius:8px}
.day.out{visibility:hidden}
.day.future{color:var(--faint)}
.day.today::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.day.in{background:var(--accent-soft);border-radius:0}
.day.s,.day.e{background:var(--accent);color:var(--on-accent);border-radius:8px}
.day.s.in-r{border-radius:8px 0 0 8px}
.day.e.in-l{border-radius:0 8px 8px 0}
.cal .cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cal .cfoot button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.cal .cfoot .go{border:none;background:var(--accent);color:var(--on-accent)}

section h2{margin:0;font-size:16px}
section .sub{color:var(--muted);font-size:12px;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:4px;transition:box-shadow .18s,transform .18s;cursor:pointer}
.card:hover{box-shadow:0 6px 20px rgba(15,25,40,.09);transform:translateY(-2px)}
.card.hero:hover{box-shadow:inset 0 0 0 1px var(--accent),0 6px 20px rgba(15,25,40,.09)}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.card .v.empty{color:var(--faint)}
.card .n{font-size:11px;color:var(--faint)}
.card.hero{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.shortcuts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sc-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;text-decoration:none;color:var(--fg);transition:background .12s,box-shadow .12s,border-color .12s;cursor:pointer;min-width:140px}
.sc-card:hover{background:var(--surface-2);box-shadow:0 2px 8px rgba(0,0,0,.07);border-color:var(--accent-soft)}
.sc-icon{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.sc-icon img{width:100%;height:100%;object-fit:contain;display:block}
.sc-card b{display:block;font-size:13px;font-weight:500;letter-spacing:-.02em}

@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cal .months .month:nth-child(2){display:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:none;border-bottom:1px solid var(--line);gap:10px}
  .side .navgroup,.side .slotgroup{display:none}
  .side .foot{margin:0 0 0 auto}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cal{left:0;right:0;margin:0 auto;width:max-content}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.card .v{font-size:19px}
  .days{grid-template-columns:repeat(7,minmax(0,1fr))}.month{width:100%}.cal{width:auto;left:0;right:0}
  .field input{width:92px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.brand-nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--fg)}
.brand-nav:hover{background:var(--surface-2)}
.brand-nav.active{background:var(--accent-soft);color:var(--accent)}
.brand-nav.active .brand-logo-name{color:var(--accent)}
.brand-logo-ic{width:52px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.brand-logo-ic img{max-width:52px;max-height:28px;width:auto;height:auto;object-fit:contain;image-rendering:-webkit-optimize-contrast}
.brand-logo-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<script>
/* ============================================================
   데이터 연결 지점 (구글 시트)
   조회 버튼을 누르면 loadData(시작일, 종료일)이 호출됩니다.
   나중에 시트 연결 시 이 함수가 아래 형태를 돌려주도록 채우면 됩니다.
   { syncedAt:"2026-10-22T09:18:00+09:00",
     net, ad, vat, fee, own, ext, b2b, refund }   // 원 단위
   ============================================================ */
async function loadData(start, end){ return null; }

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const pad = n => String(n).padStart(2,"0");
const dd = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const TODAY = dd(new Date());
const fmt = d => d ? `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}` : "";
const same = (a,b) => a && b && a.getTime()===b.getTime();

let sel = { s:new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), e:TODAY };   // 기본: 이번 달 1일 ~ 오늘
let draft = { s:sel.s, e:sel.e };
let view = new Date(TODAY.getFullYear(), TODAY.getMonth()-1, 1);             // 달력 왼쪽 달
let picking = "s";
let activeBrand = null;
const BRAND_IDS = ["terafugen","frozenlab","dentipla","mediglow","cellofit","pamicogen"];
try{ const v = JSON.parse(localStorage.getItem("cx-range")||"null"); if(v){ sel={s:new Date(v.s), e:new Date(v.e)}; draft={...sel}; } }catch(e){}

/* ---------- 키패드 입력 ---------- */
function mask(v){
  const d = v.replace(/\D/g,"").slice(0,8);
  if(d.length<=4) return d;
  if(d.length<=6) return d.slice(0,4)+"."+d.slice(4);
  return d.slice(0,4)+"."+d.slice(4,6)+"."+d.slice(6);
}
function parse(v){
  const d = v.replace(/\D/g,"");
  if(d.length!==8) return null;
  const y=+d.slice(0,4), m=+d.slice(4,6), day=+d.slice(6,8);
  const dt = new Date(y, m-1, day);
  return (dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===day) ? dt : undefined;
}
["startInput","endInput"].forEach((id,i)=>{
  const el = $("#"+id);
  el.addEventListener("input", ()=>{
    const pos = el.value.length;
    el.value = mask(el.value);
    hideMsg();
    const d = parse(el.value);
    if(d){
      draft[i?"e":"s"] = d;
      view = new Date(d.getFullYear(), d.getMonth()-(i?1:0), 1);
      if(!$("#cal").hidden) drawCal();
      if(!i && el.value.length===10 && pos>=10) $("#endInput").focus();   // 시작일 다 입력하면 종료일로 이동
    }
  });
  el.addEventListener("focus", ()=> el.select());
});

function showMsg(t){ $("#msg").textContent=t; $("#msg").hidden=false; $("#field").classList.add("err"); }
function hideMsg(){ $("#msg").hidden=true; $("#field").classList.remove("err"); }

function validate(){
  const s = parse($("#startInput").value), e = parse($("#endInput").value);
  if(s===null||e===null){ showMsg("날짜를 8자리 숫자로 모두 입력해 주세요. 예: 20261001"); return null; }
  if(s===undefined||e===undefined){ showMsg("존재하지 않는 날짜가 있습니다. 월과 일을 확인해 주세요."); return null; }
  if(s>e){ showMsg("시작일이 종료일보다 늦습니다. 날짜 순서를 확인해 주세요."); return null; }
  if(e>TODAY){ showMsg("종료일은 오늘("+fmt(TODAY)+") 이후로 지정할 수 없습니다."); return null; }
  return {s,e};
}

/* ---------- 캘린더 ---------- */
}
  $("#months").innerHTML = html;
  $("#calHint").textContent = picking==="s" ? "시작일을 선택하세요" : "종료일을 선택하세요";
}
function openCal(){
  draft = { s:parse($("#startInput").value)||sel.s, e:parse($("#endInput").value)||sel.e };
  view = new Date(draft.e.getFullYear(), draft.e.getMonth()-1, 1);
  picking = "s";
  $("#cal").hidden = false; $("#calBtn").setAttribute("aria-expanded","true");
  drawCal();
}
function closeCal(){ $("#cal").hidden = true; $("#calBtn").setAttribute("aria-expanded","false"); }

$("#calBtn").addEventListener("click", ()=> $("#cal").hidden ? openCal() : closeCal());
$("#calClose").addEventListener("click", closeCal);
$("#months").addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");
  if(nav){ view = new Date(view.getFullYear(), view.getMonth()+ +nav.dataset.nav, 1); drawCal(); return; }
  const b = e.target.closest("[data-t]"); if(!b) return;
  const d = new Date(+b.dataset.t);
  if(picking==="s"){ draft = {s:d, e:d}; picking="e"; }
  else { if(d<draft.s){ draft={s:d,e:draft.s}; } else draft.e=d; picking="s"; }
  $("#startInput").value = fmt(draft.s); $("#endInput").value = fmt(draft.e); hideMsg();
  drawCal();
});
$("#calApply").addEventListener("click", ()=>{ closeCal(); runQuery(); });
document.addEventListener("click", e=>{ const path=e.composedPath(); if(!$("#cal").hidden && !path.some(n=>n.id==="cal"||n.id==="calBtn")) closeCal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#cal").hidden){ closeCal(); $("#calBtn").focus(); } });

/* ---------- 빠른 날짜 ---------- */
function setQuick(s,e,id){
  draft={s,e}; sel={s,e};
  $("#startInput").value=fmt(s); $("#endInput").value=fmt(e);
  $$(".qshort").forEach(b=>b.classList.remove("on"));
  if(id) $("#"+id).classList.add("on");
  try{ localStorage.setItem("cx-range",JSON.stringify({s:s.getTime(),e:e.getTime()})); }catch(err){}
  closeCal(); runQuery();
}
$("#qs-today").addEventListener("click",()=>setQuick(TODAY,TODAY,"qs-today"));
$("#qs-yesterday").addEventListener("click",()=>{ const y=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-1); setQuick(y,y,"qs-yesterday"); });
$("#qs-7d").addEventListener("click",()=>{ const s=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-6); setQuick(s,TODAY,"qs-7d"); });
$("#qs-30d").addEventListener("click",()=>{ const s=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-29); setQuick(s,TODAY,"qs-30d"); });

/* ---------- 브랜드 선택 ---------- */
$$(".brand-nav").forEach((a,i)=>{
  a.dataset.brand = BRAND_IDS[i];
  a.addEventListener("click", e=>{
    e.preventDefault();
    const name = a.querySelector(".brand-logo-name").textContent;
    if(activeBrand===a.dataset.brand){
      activeBrand=null;
      $$(".brand-nav").forEach(b=>b.classList.remove("active"));
      $("#pageTitle").textContent="CX 대시보드"; const scT=$("#sc-section-title"); if(scT) scT.textContent="";
    } else {
      activeBrand=a.dataset.brand;
      $$(".brand-nav").forEach(b=>b.classList.remove("active"));
      a.classList.add("active");
      $("#pageTitle").textContent=name;
    }

    runQuery();
  });
});

/* ---------- 조회 ---------- */


async function runQuery(){
  const D=await loadData(null,null);
  render(D);
}
function won(v){
  if(v==null||isNaN(v)) return "—";
  const a=Math.abs(v), sg=v<0?"-":"";
  if(a>=1e8) return sg+(a/1e8).toFixed(2).replace(/\.?0+$/,"")+"억원";
  if(a>=1e4) return sg+Math.round(a/1e4).toLocaleString("ko-KR")+"만원";
  return sg+Math.round(a).toLocaleString("ko-KR")+"원";
}
const pct = (v,dp=1) => v==null||!isFinite(v)?"—":(v*100).toFixed(dp)+"%";
const roas = v => v==null||!isFinite(v)?"—":Math.round(v*100).toLocaleString("ko-KR")+"%";
const CARD_DEFAULTS = ["메뉴 1","메뉴 2","메뉴 3","메뉴 4"];
let cardNames = (()=>{ try{ return JSON.parse(localStorage.getItem("cx-card-names"))||CARD_DEFAULTS; }catch(e){ return [...CARD_DEFAULTS]; } })();
function saveCardNames(){ try{ localStorage.setItem("cx-card-names",JSON.stringify(cardNames)); }catch(e){} }
const card = (i,v,hero) => `<div class="card${hero?" hero":""}"><span class="k">${cardNames[i]}</span><span class="v${v==="—"?" empty":""}">${v}</span></div>`;
let selectedCard = 0;

function render(D){
  const dot=$("#connDot"); if(dot) dot.className = "dot"+(D?" ok":"");
  const ctxt=$("#connText"); if(ctxt) ctxt.textContent = D ? "데이터 연결 정상" : "데이터 미연결";
  if(D?.syncedAt){ const t=new Date(D.syncedAt); $("#syncText").textContent=`마지막 동기화 ${pad(t.getMonth()+1)}.${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`; }
  const g = k => D ? D[k] : null;
  const gross = D ? D.net*1.1 : null;
  $("#gNet").innerHTML =
    card(0, won(g("net")), selectedCard===0)+
    card(1, roas(D&&D.ad?D.net/D.ad:null), selectedCard===1)+
    card(2, pct(D&&D.net?D.ad/D.net:null,2), selectedCard===2)+
    card(3, pct(D&&gross?D.vat/gross:null), selectedCard===3);
  $$(".card").forEach((c,i)=>{
    c.addEventListener("click",()=>{ selectedCard=i; $$(".card").forEach((x,j)=>x.classList.toggle("hero",j===i)); });
  });
}



runQuery();
</script>
