<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CX 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 고정 사이드바 + 스크롤 본문. 상단 기간 조회 바 → KPI 카드 그리드 */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f9fafb; --line:rgba(42,44,47,0.2);
  --fg:rgba(42,44,47,1); --muted:rgba(42,44,47,0.72); --faint:rgba(42,44,47,0.5);
  --accent:#1577cc; --accent-soft:#e3f0fb; --on-accent:#ffffff;
  --good:#3bcc4b; --bad:#d6173a; --bad-soft:#fde8ed;
  --sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  --shadow-sm:0 1px 3px rgba(42,44,47,0.06),0 1px 2px rgba(42,44,47,0.04);
  --shadow-md:0 4px 14px rgba(42,44,47,0.09),0 2px 4px rgba(42,44,47,0.05);
  --shadow-lg:0 12px 36px rgba(42,44,47,0.12),0 4px 10px rgba(42,44,47,0.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#202028; --surface:#17171c; --surface-2:#292932; --line:rgba(243,244,246,0.14);
  --fg:#f3f4f6; --muted:rgba(243,244,246,0.72); --faint:rgba(243,244,246,0.5);
  --accent:#1da4ff; --accent-soft:#0f2340; --on-accent:#ffffff;
  --good:#3bcc4b; --bad:#f27272; --bad-soft:#2d141b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#202028; --surface:#17171c; --surface-2:#292932; --line:rgba(243,244,246,0.14);
  --fg:#f3f4f6; --muted:rgba(243,244,246,0.72); --faint:rgba(243,244,246,0.5);
  --accent:#1da4ff; --accent-soft:#0f2340; --on-accent:#ffffff;
  --good:#3bcc4b; --bad:#f27272; --bad-soft:#2d141b; color-scheme:dark}
*{box-sizing:border-box}
body{zoom:.95;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:12px}
.navlabel{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:0 8px;margin-bottom:6px;font-weight:600}
.nav a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;text-decoration:none;color:var(--fg)}
.nav a.on{background:var(--surface-2)}
.nav a .ic{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.nav a b{display:block;font-size:14px}
.nav a small{color:var(--muted);font-size:12px}
.slot{border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);font-size:12px;line-height:1.55}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--good)}

/* Main */
.main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;min-width:0}
.head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.head .sync{color:var(--muted);font-size:12px}

/* 기간 조회 */
.toolbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.qrow .lbl{font-size:12px;color:var(--muted)}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;background:var(--surface);flex-wrap:wrap}
.field:focus-within{border-color:var(--accent)}
.field.err{border-color:var(--bad)}
.field input{border:none;background:transparent;width:104px;font-family:var(--mono);font-size:14px;padding:4px 2px;outline:none;letter-spacing:.02em}
.field input::placeholder{color:var(--faint)}
.field .sep{color:var(--faint)}
.calbtn{border:none;background:var(--surface-2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.calbtn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.go{border:none;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:10px;padding:8px 18px}
.hint{font-size:12px;color:var(--faint)}
.msg{font-size:12px;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:6px 10px}
.qshorts{display:flex;gap:6px;flex-wrap:wrap}
.qshort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.qshort:hover{background:var(--surface-2);color:var(--fg)}
.qshort.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

/* 캘린더 팝오버 */
.cal{position:absolute;top:calc(100% + 6px);left:14px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:14px;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 32px)}.cal[hidden]{display:none}
.cal .months{display:flex;gap:20px}
.month{width:252px}
.month .mh{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:4px}
.month .mh b{font-size:14px}
.navb{border:none;background:transparent;width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:16px}
.navb:hover{background:var(--surface-2)}
.navb.ghost{visibility:hidden}
.days{display:grid;grid-template-columns:repeat(7,36px);row-gap:2px}
.days .wd{font-size:11px;color:var(--faint);text-align:center;height:24px;line-height:24px}
.days .wd.sun{color:var(--bad)}
.day{border:none;background:transparent;height:34px;font-size:13px;border-radius:0;position:relative}
.day:hover{background:var(--surface-2);border-radius:8px}
.day.out{visibility:hidden}
.day.future{color:var(--faint)}
.day.today::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.day.in{background:var(--accent-soft);border-radius:0}
.day.s,.day.e{background:var(--accent);color:var(--on-accent);border-radius:8px}
.day.s.in-r{border-radius:8px 0 0 8px}
.day.e.in-l{border-radius:0 8px 8px 0}
.cal .cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.cal .cfoot button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.cal .cfoot .go{border:none;background:var(--accent);color:var(--on-accent)}

section h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.45}
section .sub{color:var(--muted);font-size:12px;margin:2px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:4px;transition:box-shadow .18s var(--ease),transform .18s var(--ease);cursor:pointer}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card.hero:hover{box-shadow:inset 0 0 0 1px var(--accent),0 6px 20px rgba(15,25,40,.09)}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.card .v.empty{color:var(--faint)}
.card .n{font-size:11px;color:var(--faint)}
.card.hero{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.shortcuts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sc-card{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;text-decoration:none;color:var(--fg);transition:background .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);cursor:pointer;min-width:120px;will-change:transform}
.sc-card:hover{background:var(--surface);box-shadow:var(--shadow-md);border-color:var(--line);transform:translateY(-1px)}
.sc-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.sc-icon img{width:100%;height:100%;object-fit:contain;display:block}
.sc-card b{display:block;font-size:13px;font-weight:500;letter-spacing:-.02em;text-align:center}

@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 캘린더 */
#cal-view{padding:0;display:flex;flex-direction:column;flex:1;min-height:0}
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-title{font-size:20px;font-weight:700;flex:1;text-align:center;letter-spacing:-.02em}
.cal-nav{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--fg);display:flex;align-items:center;justify-content:center;line-height:1}
.cal-nav:hover{background:var(--surface-2)}
.cal-add-btn{padding:6px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.cal-add-btn:hover{opacity:.88}
.cal-io-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.cal-io-btn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);gap:4px;flex:1}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-dow:first-child{color:#e05252}
.cal-dow:last-child{color:#4a90d9}
.cal-day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:default;position:relative;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:background .15s,box-shadow .15s}
.cal-day:hover{background:var(--accent-soft);box-shadow:var(--shadow-sm)}
.cal-day.today .cal-dn{background:var(--accent);color:#fff!important;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-day.other-month .cal-dn{color:var(--muted)}
.cal-day.sun .cal-dn{color:#e05252}
.cal-day.sat .cal-dn{color:#4a90d9}
.cal-dn{font-size:12px;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-chips{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.cal-chip{height:14px;border-radius:4px;font-size:9px;color:#fff;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14px;cursor:pointer}
.cal-edit-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.95);border:1.2px solid #d1d5db;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s,border-color .12s;z-index:2;padding:0;color:#6b7280}
.cal-day:hover .cal-edit-btn{opacity:1}
.cal-edit-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#cal-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center}
#cal-modal[hidden]{display:none}
.cal-modal-box{background:var(--surface);border-radius:20px;padding:22px 24px;width:440px;max-width:94vw;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
.cal-modal-head{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700}
#cal-modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);line-height:1}
.cal-field{display:flex;flex-direction:column;gap:6px}
.cal-label{font-size:12px;font-weight:600;color:var(--fg)}
.cal-opt{font-weight:400;color:var(--muted);margin-left:4px}
.cal-input{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;background:var(--surface-2);color:var(--fg);font-family:inherit;width:100%}
.cal-time-wrap{display:flex;align-items:center;gap:6px}
.cal-time-sel{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--fg);font-family:inherit;cursor:pointer;min-width:60px;text-align:center;-webkit-appearance:none;appearance:none}
.cal-time-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(21,119,204,0.15)}
.cal-time-colon{font-size:16px;font-weight:700;color:var(--fg);margin:0 2px}
.cal-time-ampm{border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s}
.cal-time-ampm.is-pm{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-name-edit{min-height:36px;cursor:text;outline:none;line-height:1.4;box-sizing:border-box}
.cal-name-edit:empty:before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.cal-name-edit:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(21,119,204,0.15)}
.cal-name-edit .cal-kw-tag{font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 3px}
.cal-img-label.active,.cal-kw-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cal-chip-wrap{display:flex;align-items:center;gap:2px}
.cal-chip-link-dot{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;transition:opacity .12s,transform .12s}
.cal-chip-link-dot:hover{opacity:.8;transform:scale(1.15)}
.cal-kw-btns{display:flex;gap:8px;flex-wrap:wrap}
.cal-kw-btn{border:1.5px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--fg);cursor:pointer;transition:all .15s;font-family:inherit}
.cal-kw-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-kw-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cal-input:focus{outline:none;border-color:var(--accent)}
.cal-textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;min-height:80px;resize:vertical;background:var(--surface-2);color:var(--fg);font-family:inherit;width:100%}
.cal-textarea:focus{outline:none;border-color:var(--accent)}
.cal-img-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.cal-img-label{padding:5px 12px;border:1px solid var(--line);border-radius:8px;font-size:12px;cursor:pointer;background:var(--surface-2);white-space:nowrap}
.cal-img-label:hover{background:var(--accent-soft);border-color:var(--accent)}
.cal-range-row{flex-direction:row;align-items:center}
.cal-check-label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.cal-brands{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 12px}
.cal-brand-label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap}
.cal-modal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.cal-colors{display:flex;gap:7px;align-items:center}
.cal-color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .12s,border-color .12s;flex-shrink:0}
.cal-color-swatch.selected{border-color:#111;transform:scale(1.25)}
.cal-color-swatch[disabled]{opacity:.22;cursor:not-allowed;pointer-events:none}
.cal-modal-btns{display:flex;gap:8px;flex-wrap:nowrap;align-items:center}
.cal-modal-btns button{padding:7px 18px;border-radius:9px;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600}
#cal-modal-save{background:var(--accent);color:#fff;border-color:var(--accent)}
#cal-modal-del{background:none;color:var(--muted)}

/* 플랫폼 섹션 */
.plat-section{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.plat-label{font-size:16px;font-weight:600;color:var(--fg);margin:0}
.plat-row{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;padding-bottom:4px;margin-top:8px}

.plat-card{flex:0 0 auto;width:130px;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--fg);font-size:13px;font-weight:500;letter-spacing:-.02em;text-align:center;cursor:pointer;text-decoration:none;transition:background .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);padding:16px 12px;will-change:transform}
.plat-card:hover{background:var(--surface);box-shadow:var(--shadow-md);border-color:var(--line);transform:translateY(-1px)}
.plat-card .plat-ico{font-size:20px;line-height:1}

.plat-logo{width:48px;height:48px;object-fit:contain;display:block;flex-shrink:0}
.plat-card span{font-size:13px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;display:block}

/* 카페24 자격증명 팝업 */
.c24-popup{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:16px;min-width:240px;display:flex;flex-direction:column;gap:10px}
.c24-popup[hidden]{display:none}
.c24-popup-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c24-popup-head b{font-size:13px}
.c24-popup-close{border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px}
.c24-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c24-row[hidden]{display:none!important}
.c24-row .lbl{font-size:11px;color:var(--muted);width:52px;flex:none}
.c24-row .val{font-size:13px;font-family:var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c24-copy{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;transition:background .12s,color .12s}
.c24-copy:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.c24-copy.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
@media (max-width:640px){.cal .months .month:nth-child(2){display:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:none;border-bottom:1px solid var(--line);gap:10px}
  .side .navgroup,.side .slotgroup{display:none}
  .side .foot{margin:0 0 0 auto}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cal{left:0;right:0;margin:0 auto;width:max-content}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.card .v{font-size:19px}
  .days{grid-template-columns:repeat(7,minmax(0,1fr))}.month{width:100%}.cal{width:auto;left:0;right:0}
  .field input{width:92px}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(42,44,47,.22);border-radius:100px}
::-webkit-scrollbar-button{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}}
:root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.brand-nav{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--fg)}
.brand-nav:hover{background:var(--surface-2)}
.brand-nav.active{background:var(--accent-soft);color:var(--accent)}
.brand-nav.active .brand-logo-name{color:var(--accent)}
.brand-logo-ic{width:60px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.brand-logo-ic img{max-width:58px;max-height:32px;width:auto;height:auto;object-fit:contain;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;image-rendering:high-quality;-ms-interpolation-mode:bicubic;transform:translateZ(0)}
.brand-logo-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

/* ---------- 키패드 입력 ---------- */
function mask(v){
  const d = v.replace(/\D/g,"").slice(0,8);
  if(d.length<=4) return d;
  if(d.length<=6) return d.slice(0,4)+"."+d.slice(4);
  return d.slice(0,4)+"."+d.slice(4,6)+"."+d.slice(6);
}
function parse(v){
  const d = v.replace(/\D/g,"");
  if(d.length!==8) return null;
  const y=+d.slice(0,4), m=+d.slice(4,6), day=+d.slice(6,8);
  const dt = new Date(y, m-1, day);
  return (dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===day) ? dt : undefined;
}

/* 기본 브랜드: 테라퓨젠 */
window.addEventListener('DOMContentLoaded', () => {

});

/* ===== 캘린더 ===== */
(function(){
  const DAYS = ['일','월','화','수','목','금','토'];
  const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const STORE_KEY = 'cx-cal-events';
  const COLORS = ['#e05252','#f5a623','#f8e71c','#7ed321','#4a90d9','#9b59b6'];

  /* ---- 시간 피커 헬퍼 ---- */
  function _apBtn(p){ return document.getElementById('cal-tap-'+p); }
  function _updateApBtn(btn){
    if(btn.dataset.val==='오후'){ btn.classList.add('is-pm'); }
    else { btn.classList.remove('is-pm'); }
  }
  function getTimeVal(p){
    const h=document.getElementById('cal-th-'+p).value;
    if(!h) return '';
    const m=document.getElementById('cal-tm-'+p).value||'00';
    const ap=_apBtn(p).dataset.val;
    let hh=parseInt(h);
    if(ap==='오전'&&hh===12) hh=0;
    else if(ap==='오후'&&hh!==12) hh+=12;
    return String(hh).padStart(2,'0')+':'+m;
  }
  function setTimeVal(p,val){
    const hEl=document.getElementById('cal-th-'+p);
    const mEl=document.getElementById('cal-tm-'+p);
    const apEl=_apBtn(p);
    if(!val){ hEl.value=''; mEl.value='00'; apEl.dataset.val='오전'; apEl.textContent='오전'; _updateApBtn(apEl); return; }
    const [hh,mm]=val.split(':');
    let h=parseInt(hh);
    const ap=h>=12?'오후':'오전';
    if(h>12) h-=12; else if(h===0) h=12;
    hEl.value=String(h);
    const mins=['00','05','10','15','20','25','30','35','40','45','50','55'];
    const mv=mm?String(parseInt(mm)).padStart(2,'0'):'00';
    mEl.value=mins.includes(mv)?mv:'00';
    apEl.dataset.val=ap; apEl.textContent=ap; _updateApBtn(apEl);
  }
  ['s','e'].forEach(function(p){
    document.getElementById('cal-tap-'+p).addEventListener('click',function(){
      const btn=_apBtn(p);
      const next=btn.dataset.val==='오전'?'오후':'오전';
      btn.dataset.val=next; btn.textContent=next; _updateApBtn(btn);
    });
  });

  /* ---- 일정명 rich-text 헬퍼 ---- */
  function nameToHtml(text){
    return (text||'').replace(/\[([^\]]*)\]/g,'<span class="cal-kw-tag">[$1]</span>');
  }
  function setNameHtml(text){
    const el=document.getElementById('cal-modal-name');
    el.innerHTML=nameToHtml(text);
    syncKwBtns();
  }
  function formatNameEl(){
    const el=document.getElementById('cal-modal-name');
    const sel=window.getSelection();
    let offset=0;
    if(sel.rangeCount){
      const pre=document.createRange();
      pre.selectNodeContents(el);
      pre.setEnd(sel.getRangeAt(0).startContainer,sel.getRangeAt(0).startOffset);
      offset=pre.toString().length;
    }
    el.innerHTML=nameToHtml(el.textContent);
    // 커서 복원
    let rem=offset;
    const walk=(node)=>{
      if(node.nodeType===3){
        if(rem<=node.length){
          const r=document.createRange();
          r.setStart(node,rem); r.collapse(true);
          sel.removeAllRanges(); sel.addRange(r);
          return true;
        }
        rem-=node.length; return false;
      }
      for(const c of node.childNodes) if(walk(c)) return true;
    };
    walk(el);
    syncKwBtns();
  }
  function syncKwBtns(){
    const text=document.getElementById('cal-modal-name').textContent;
    document.querySelectorAll('.cal-kw-btn').forEach(btn=>{
      btn.classList.toggle('active', text.includes('['+btn.dataset.kw+']'));
    });
  }

  function loadEvents(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e){ return []; } }
  function saveEvents(ev){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(ev)); }catch(e){} }

  /* ---- 내보내기 / 가져오기 ---- */
  document.getElementById('cal-export').addEventListener('click',function(){
    const data = JSON.stringify(loadEvents(), null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cx-calendar-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('cal-import-input').addEventListener('change',function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const imported = JSON.parse(ev.target.result);
        if(!Array.isArray(imported)) throw new Error('invalid');
        const existing = loadEvents();
        const existingIds = new Set(existing.map(x=>x.id));
        const merged = [...existing, ...imported.filter(x=>!existingIds.has(x.id))];
        saveEvents(merged);
        renderCal();
        alert('일정을 가져왔습니다. (중복 제외 '+imported.filter(x=>!existingIds.has(x.id)).length+'개 추가)');
      }catch(err){ alert('파일 형식이 올바르지 않습니다.'); }
    };
    reader.readAsText(file);
    e.target.value='';
  });

  function toKey(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  function todayKey(){ const t=new Date(); return toKey(t.getFullYear(),t.getMonth(),t.getDate()); }

  const today = new Date();
  let curYear = today.getFullYear();
  let curMonth = today.getMonth();
  let editingId = null;
  let selectedColor = COLORS[0];

  /* ---- 렌더 ---- */
  function renderCal(){
    const events = loadEvents();
    document.getElementById('cal-title').textContent = curYear+'년 '+MONTHS[curMonth];
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    DAYS.forEach((d,i)=>{
      const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
    });
    const startOffset = new Date(curYear,curMonth,1).getDay();
    const daysInMonth = new Date(curYear,curMonth+1,0).getDate();
    const daysInPrev = new Date(curYear,curMonth,0).getDate();
    for(let i=0;i<42;i++){
      const cell=document.createElement('div'); cell.className='cal-day';
      let d,m,y,otherMonth=false;
      if(i<startOffset){ d=daysInPrev-startOffset+i+1; m=curMonth-1; y=curYear; if(m<0){m=11;y--;} otherMonth=true; }
      else if(i>=startOffset+daysInMonth){ d=i-startOffset-daysInMonth+1; m=curMonth+1; y=curYear; if(m>11){m=0;y++;} otherMonth=true; }
      else{ d=i-startOffset+1; m=curMonth; y=curYear; }
      const dow=new Date(y,m,d).getDay();
      if(dow===0) cell.classList.add('sun');
      if(dow===6) cell.classList.add('sat');
      if(otherMonth) cell.classList.add('other-month');
      const key=toKey(y,m,d);
      if(!otherMonth && key===todayKey()) cell.classList.add('today');
      const dn=document.createElement('div'); dn.className='cal-dn'; dn.textContent=d; cell.appendChild(dn);
      // 이 날짜에 걸리는 이벤트 표시
      const dayEvs=events.filter(ev=>ev.start<=key&&ev.end>=key);
      if(dayEvs.length){
        const chips=document.createElement('div'); chips.className='cal-chips';
        dayEvs.forEach(ev=>{
          const chip=document.createElement('div');
          chip.className='cal-chip';
          chip.style.background=ev.color;
          chip.textContent=ev.name||(ev.text?ev.text.slice(0,12):'')||(ev.image?'📷':'');
          chip.title=(ev.name||'')+'\n'+(ev.text||'');
          chip.dataset.id=ev.id;
          chip.addEventListener('click',e=>{e.stopPropagation();openEdit(ev.id);});
          const chipWrap=document.createElement('div'); chipWrap.className='cal-chip-wrap';
          chipWrap.appendChild(chip);
          if(ev.url){
            const la=document.createElement('a'); la.href=ev.url; la.target='_blank'; la.rel='noopener';
            la.className='cal-chip-link-dot'; la.title=ev.url;
            la.style.background=ev.color;
            la.innerHTML='<svg viewBox="0 0 10 10" width="8" height="8" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.6" stroke-linecap="round"><path d="M4 6l2-2M3 5.5l-.7.7a1.5 1.5 0 0 0 2.1 2.1l.7-.7M7 4.5l.7-.7a1.5 1.5 0 0 0-2.1-2.1L4.9 2.4"/></svg>';
            la.addEventListener('click',e=>e.stopPropagation());
            chipWrap.appendChild(la);
          }
          chips.appendChild(chipWrap);
        });
        cell.appendChild(chips);
        const editBtn=document.createElement('button');
        editBtn.className='cal-edit-btn';
        editBtn.title='일정 편집';
        editBtn.innerHTML='<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H2v-3L11.5 2.5z"/></svg>';
        editBtn.addEventListener('click',e=>{e.stopPropagation();openEdit(dayEvs[0].id);});
        cell.appendChild(editBtn);
      }
      grid.appendChild(cell);
    }
  }

  /* ---- 색상 팔레트 ---- */
  function renderColors(disabledColors=[]){
    const container=document.getElementById('cal-colors');
    container.innerHTML='';
    COLORS.forEach(c=>{
      const sw=document.createElement('button');
      sw.className='cal-color-swatch';
      sw.style.background=c;
      sw.title=c;
      if(disabledColors.includes(c)) sw.setAttribute('disabled','');
      if(c===selectedColor && !disabledColors.includes(c)) sw.classList.add('selected');
      if(c===selectedColor && disabledColors.includes(c)){ selectedColor=COLORS.find(x=>!disabledColors.includes(x))||COLORS[0]; }
      sw.addEventListener('click',()=>{ selectedColor=c; renderColors(disabledColors); });
      container.appendChild(sw);
    });
  }

  /* ---- 모달 공통 초기화 ---- */
  function resetModal(){
    document.getElementById('cal-modal-range').checked=false;

    document.querySelectorAll('#cal-brands input').forEach(cb=>cb.checked=false);
  }

  /* ---- 모달 열기 (신규) ---- */
  function openAdd(){
    editingId=null;
    const tk=todayKey();
    document.getElementById('cal-modal-title').textContent='일정 등록';
    setNameHtml('');
    document.getElementById('cal-modal-start').value=tk;
    document.getElementById('cal-modal-end').value=tk;
    document.getElementById('cal-modal-text').value='';
    document.getElementById('cal-modal-del').style.display='none';
    resetModal();
    selectedColor=COLORS[0];
    const usedOnStart=loadEvents().filter(ev=>ev.start<=tk&&ev.end>=tk).map(ev=>ev.color);
    renderColors(usedOnStart);
    document.getElementById('cal-modal').hidden=false;
    setTimeout(()=>document.getElementById('cal-modal-name').focus(),50);
  }

  /* ---- 모달 열기 (수정) ---- */
  function openEdit(id){
    const ev=loadEvents().find(e=>e.id===id); if(!ev) return;
    editingId=id;
    document.getElementById('cal-modal-title').textContent='일정 편집';
    setNameHtml(ev.name||'');
    document.getElementById('cal-modal-start').value=ev.start;
    document.getElementById('cal-modal-text').value=ev.text||'';
    resetModal();
    setTimeVal('s',ev.time||'');
    if(ev.end&&ev.end!==ev.start){
      document.getElementById('cal-modal-range').checked=true;
      document.getElementById('cal-end-field').style.display='';
      document.getElementById('cal-end-time-field').style.display='';
      document.getElementById('cal-modal-end').value=ev.end;
      setTimeVal('e',ev.timeEnd||'');
    } else {
      document.getElementById('cal-modal-end').value=ev.start;
    }
    if(ev.brands) ev.brands.forEach(b=>{ const cb=document.querySelector(`#cal-brands input[value="${b}"]`); if(cb) cb.checked=true; });
    if(ev.url){ document.getElementById('cal-modal-url').value=ev.url; document.getElementById('cal-link-row').style.display=''; document.getElementById('cal-link-toggle').classList.add('active'); }
    document.getElementById('cal-modal-del').style.display='';
    selectedColor=ev.color||COLORS[0];
    const others=loadEvents().filter(e=>e.id!==id);
    const usedOnStart=others.filter(e=>e.start<=ev.start&&e.end>=ev.start).map(e=>e.color);
    renderColors(usedOnStart);
    document.getElementById('cal-modal').hidden=false;
    setTimeout(()=>document.getElementById('cal-modal-name').focus(),50);
  }

  /* ---- 저장 ---- */
  document.getElementById('cal-modal-save').addEventListener('click',()=>{
    const name=document.getElementById('cal-modal-name').textContent.trim();
    if(!name) { document.getElementById('cal-modal-name').focus(); return; }
    const start=document.getElementById('cal-modal-start').value; if(!start) return;
    const isRange=document.getElementById('cal-modal-range').checked;
    const rawEnd=document.getElementById('cal-modal-end').value;
    const end=isRange&&rawEnd&&rawEnd>=start?rawEnd:start;
    const text=document.getElementById('cal-modal-text').value.trim();
    const time=getTimeVal('s');
    const timeEnd=getTimeVal('e');
    const url=document.getElementById('cal-modal-url').value.trim();
    const brands=[...document.querySelectorAll('#cal-brands input:checked')].map(cb=>cb.value);
    const events=loadEvents();
    if(editingId){
      const idx=events.findIndex(e=>e.id===editingId);
      if(idx>-1) events[idx]={...events[idx],name,start,end,text,time,timeEnd,url,brands,color:selectedColor};
    } else {
      events.push({id:Date.now()+'',name,start,end,text,time,timeEnd,url,brands,color:selectedColor});
    }
    saveEvents(events); renderCal();
    document.getElementById('cal-modal').hidden=true;
  });

  /* ---- 삭제 ---- */
  document.getElementById('cal-modal-del').addEventListener('click',()=>{
    if(!editingId) return;
    saveEvents(loadEvents().filter(e=>e.id!==editingId)); renderCal();
    document.getElementById('cal-modal').hidden=true;
  });


  /* ---- 시작일 변경 → 색상 갱신 ---- */
  document.getElementById('cal-modal-start').addEventListener('change',()=>{
    const s=document.getElementById('cal-modal-start').value;
    const e=document.getElementById('cal-modal-end').value;
    if(e&&e<s) document.getElementById('cal-modal-end').value=s;
    const used=loadEvents().filter(ev=>(editingId?ev.id!==editingId:true)&&ev.start<=s&&ev.end>=s).map(ev=>ev.color);
    renderColors(used);
  });

  /* ---- 링크 토글 ---- */
  document.getElementById('cal-link-toggle').addEventListener('click',()=>{
    const row=document.getElementById('cal-link-row');
    const btn=document.getElementById('cal-link-toggle');
    const open=row.style.display==='none'||row.style.display==='';
    row.style.display=open?'':'none';
    btn.classList.toggle('active',open);
    if(open) setTimeout(()=>document.getElementById('cal-modal-url').focus(),50);
  });

  /* ---- 키워드 태그 버튼 ---- */
  document.querySelectorAll('.cal-kw-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const el=document.getElementById('cal-modal-name');
      const tag='['+btn.dataset.kw+']';
      const text=el.textContent;
      if(text.includes(tag)){
        setNameHtml(text.replace(tag,'').replace(/^\s+/,''));
      } else {
        setNameHtml((text?text+' ':'')+tag);
      }
      el.focus();
    });
  });

  /* ---- 일정명 contenteditable 실시간 포맷 (한글 IME 안전) ---- */
  let _nameComposing=false;
  const _nameEl=document.getElementById('cal-modal-name');
  _nameEl.addEventListener('compositionstart',()=>{ _nameComposing=true; });
  _nameEl.addEventListener('compositionend',()=>{ _nameComposing=false; formatNameEl(); });
  _nameEl.addEventListener('input',()=>{ if(!_nameComposing) formatNameEl(); });

  document.getElementById('cal-modal-close').addEventListener('click',()=>{ document.getElementById('cal-modal').hidden=true; });
  document.getElementById('cal-modal').addEventListener('click',e=>{ if(e.target===document.getElementById('cal-modal')) document.getElementById('cal-modal').hidden=true; });
  document.getElementById('cal-add').addEventListener('click',openAdd);
  document.getElementById('cal-prev').addEventListener('click',()=>{ curMonth--; if(curMonth<0){curMonth=11;curYear--;} renderCal(); });
  document.getElementById('cal-next').addEventListener('click',()=>{ curMonth++; if(curMonth>11){curMonth=0;curYear++;} renderCal(); });

  /* ---- 탭 전환 ---- */
  const navCal=document.getElementById('nav-calendar');
  const brandSection=document.getElementById('sc-pamicogen');
  const calView=document.getElementById('cal-view');
  const pageTitleEl=document.getElementById('pageTitle');

  function showCalendar(){
    if(brandSection) brandSection.style.display='none';
    if(calView) calView.style.display='';
    if(pageTitleEl) pageTitleEl.textContent='캘린더';
    renderCal();
  }
  function showDashboard(){
    if(brandSection) brandSection.style.display='';
    if(calView) calView.style.display='none';
  }

  navCal.addEventListener('click',e=>{
    e.preventDefault();
    if(calView.style.display!=='none'){ showDashboard(); }
    else { showCalendar(); }
  });
})();


/* ---------- 브랜드 선택 ---------- */

      const _cv=document.getElementById('cal-view'), _bp=document.getElementById('sc-pamicogen');

    }

    runQuery();

/* ---------- 조회 ---------- */


async function runQuery(){
  const D=await loadData(null,null);
  render(D);
}
function won(v){
  if(v==null||isNaN(v)) return "—";
  const a=Math.abs(v), sg=v<0?"-":"";
  if(a>=1e8) return sg+(a/1e8).toFixed(2).replace(/\.?0+$/,"")+"억원";
  if(a>=1e4) return sg+Math.round(a/1e4).toLocaleString("ko-KR")+"만원";
  return sg+Math.round(a).toLocaleString("ko-KR")+"원";
}
const pct = (v,dp=1) => v==null||!isFinite(v)?"—":(v*100).toFixed(dp)+"%";
const roas = v => v==null||!isFinite(v)?"—":Math.round(v*100).toLocaleString("ko-KR")+"%";
const CARD_DEFAULTS = ["메뉴 1","메뉴 2","메뉴 3","메뉴 4"];
let cardNames = (()=>{ try{ return JSON.parse(localStorage.getItem("cx-card-names"))||CARD_DEFAULTS; }catch(e){ return [...CARD_DEFAULTS]; } })();
function saveCardNames(){ try{ localStorage.setItem("cx-card-names",JSON.stringify(cardNames)); }catch(e){} }
const card = (i,v,hero) => `<div class="card${hero?" hero":""}"><span class="k">${cardNames[i]}</span><span class="v${v==="—"?" empty":""}">${v}</span></div>`;
let selectedCard = 0;

function render(D){
  const dot=$("#connDot"); if(dot) dot.className = "dot"+(D?" ok":"");
  const ctxt=$("#connText"); if(ctxt) ctxt.textContent = D ? "데이터 연결 정상" : "데이터 미연결";
  if(D?.syncedAt){ const t=new Date(D.syncedAt); $("#syncText").textContent=`마지막 동기화 ${pad(t.getMonth()+1)}.${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`; }
  const g = k => D ? D[k] : null;
  const gross = D ? D.net*1.1 : null;
  if($("#gNet")) $("#gNet").innerHTML =
    card(0, won(g("net")), selectedCard===0)+
    card(1, roas(D&&D.ad?D.net/D.ad:null), selectedCard===1)+
    card(2, pct(D&&D.net?D.ad/D.net:null,2), selectedCard===2)+
    card(3, pct(D&&gross?D.vat/gross:null), selectedCard===3);
  $$(".card").forEach((c,i)=>{
    c.addEventListener("click",()=>{ selectedCard=i; $$(".card").forEach((x,j)=>x.classList.toggle("hero",j===i)); });
  });
}



runQuery();

/* ---------- 카페24 자격증명 팝업 ---------- */
(function(){
  const popup = document.createElement('div');
  popup.className = 'c24-popup';
  popup.hidden = true;
  popup.innerHTML = `
    <div class="c24-popup-head">
      <b id="c24-brand-name"></b>
      <button class="c24-popup-close" id="c24-close">✕</button>
    </div>
    <div class="c24-row" id="c24-row-mallid">
      <span class="lbl" id="c24-lbl-id">쇼핑몰ID</span>
      <span class="val" id="c24-mall-id"></span>
      <button class="c24-copy" data-target="c24-mall-id">복사</button>
    </div>
    <div class="c24-row" id="c24-row-domain">
      <span class="lbl">도메인</span>
      <span class="val" id="c24-domain"></span>
      <button class="c24-copy" data-target="c24-domain">복사</button>
    </div>
    <div class="c24-row" id="c24-row-userid">
      <span class="lbl">아이디</span>
      <span class="val" id="c24-user-id"></span>
      <button class="c24-copy" data-target="c24-user-id">복사</button>
    </div>
    <div class="c24-row">
      <span class="lbl">비밀번호</span>
      <span class="val" id="c24-passwd">••••••••</span>
      <button class="c24-copy" data-target="c24-passwd" data-secret="">복사</button>
    </div>`;
  document.body.appendChild(popup);

  function showPopup(brand, anchorEl, info, label){
    if(!info) info = BRAND_CAFE24[brand];
    if(!info || info.passwd==='___') return;
    const brandName = document.querySelector(`.brand-nav[data-brand="${brand}"] .brand-logo-name`)?.textContent || brand;
    document.getElementById('c24-brand-name').textContent = `${brandName} ${label||'카페24'}`;
    const mallRow = document.getElementById('c24-row-mallid');
    const userRow = document.getElementById('c24-row-userid');
    const domainRow = document.getElementById('c24-row-domain');
    if(info.mallId !== undefined){
      mallRow.hidden = false;
      document.getElementById('c24-lbl-id').textContent = '쇼핑몰ID';
      document.getElementById('c24-mall-id').textContent = info.mallId;
      domainRow.hidden = true;
      userRow.hidden = false;
      document.getElementById('c24-user-id').textContent = info.userId;
    } else {
      mallRow.hidden = true;
      if(info.domain !== undefined){
        domainRow.hidden = false;
        document.getElementById('c24-domain').textContent = info.domain;
      } else {
        domainRow.hidden = true;
      }
      userRow.hidden = false;
      document.getElementById('c24-user-id').textContent = info.userId;
    }
    const passwdBtn = popup.querySelector('[data-target="c24-passwd"]');
    passwdBtn.dataset.secret = info.passwd;
    popup.hidden = false;
    const rect = anchorEl.getBoundingClientRect();
    const top = rect.bottom + 6;
    const left = Math.min(rect.left, window.innerWidth - 260);
    popup.style.top = top + 'px';
    popup.style.left = left + 'px';
  }

  popup.querySelectorAll('.c24-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.target;
      const text = btn.dataset.secret !== undefined && btn.dataset.secret !== ''
        ? btn.dataset.secret
        : document.getElementById(targetId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ 복사됨';
        btn.classList.add('ok');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 1500);
      });
    });
  });

  document.getElementById('c24-close').addEventListener('click', () => { popup.hidden = true; });
  document.addEventListener('click', e => {
    const keepIds = ['sc-link-cafe24','sc-link-ezyadmin'];
    if(!popup.hidden && !popup.contains(e.target) && !keepIds.includes(e.target.id)) popup.hidden = true;
  });

  document.querySelectorAll('.sc-card').forEach(card => {
    card.addEventListener('click', e => {
      e.preventDefault();
      if(!activeBrand) return;
      const id = card.id;
      if(id === 'sc-link-cafe24'){
        const info = BRAND_CAFE24[activeBrand];
        if(info && info.mallId && info.mallId !== '___'){
          e.stopPropagation();
          showPopup(activeBrand, card, null, '카페24');
        }
      } else if(id === 'sc-link-ezyadmin'){
        const info = BRAND_EZYADMIN[activeBrand];
        if(info && info.userId && info.userId !== '___'){
          e.stopPropagation();
          showPopup(activeBrand, card, info, '이지어드민');
        }
      }
    });
    card.addEventListener('dblclick', e => {
      e.preventDefault();
      popup.hidden = true;
      if(!activeBrand) return;
      if(card.id === 'sc-link-cafe24'){
        loginCafe24(activeBrand);
      } else if(card.href && card.href !== '#'){
        window.open(card.href, '_blank');
      }
    });
  });
})();
